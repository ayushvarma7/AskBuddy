[project]
name = "ask-buddy"
version = "0.1.0"
description = "Multi-domain agentic RAG bot for Slack — HR/IT policy Q&A, reminders, and GitHub triage"
requires-python = ">=3.13"
dependencies = [
    "cuga>=0.3.0",
    "httpx>=0.27.0",
    "langchain-google-genai>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.2",
    "slack-bolt>=1.18.1",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    # APScheduler's SQLAlchemyJobStore — persists reminder jobs across restarts.
    "sqlalchemy>=2.0",
]

[dependency-groups]
# Installed by `uv sync` for local dev and in CI; not needed at runtime.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a live Postgres + GOOGLE_API_KEY (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.13"
files = ["src/ask_buddy"]
# cuga, langchain, slack_bolt, pgvector and psycopg2 ship no stubs.
ignore_missing_imports = true
# Checks inside functions that lack annotations — most of this codebase. This
# is where the real value is, and it passes clean.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true
no_implicit_optional = true
strict_equality = true
# Every function must declare its signature. Framework boundaries — psycopg2
# cursors, Slack Bolt's injected arguments, LangChain @tool objects, APScheduler
# instances — are annotated Any, which is the honest type for an object whose
# library ships no usable one.
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Deliberately narrow: pyflakes plus the pycodestyle rules that catch real
# mistakes (bad imports, ambiguous names, syntax-level errors). Formatting
# opinions are left out so the existing style stands as written.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules must call load_dotenv() before importing .db, so their
# imports legitimately sit below module-level code.
"src/ask_buddy/feedback_digest.py" = ["E402"]
"src/ask_buddy/feedback_report.py" = ["E402"]
# Tests import mid-file next to the cases that use them, and use throwaway
# lambdas as stubs — both are clearer here than the alternatives.
"tests/*" = ["E402", "E731"]
