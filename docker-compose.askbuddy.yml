services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askbuddy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: askbuddy
      POSTGRES_USER: askbuddy
      POSTGRES_PASSWORD: askbuddy_secret
    ports:
      - "5432:5432"
    volumes:
      - askbuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbuddy -d askbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  askbuddy:
    build: .
    container_name: askbuddy_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Socket Mode dials out to Slack, so no ports are published.
    env_file:
      - .env
    environment:
      # Override the .env default: inside the compose network Postgres is
      # reachable as 'postgres', not localhost.
      ASK_BUDDY_DB_DSN: postgresql://askbuddy:askbuddy_secret@postgres:5432/askbuddy
      ASK_BUDDY_LOG_FORMAT: json
    # Give in-flight answers time to finish before SIGKILL; matches the
    # default ASK_BUDDY_SHUTDOWN_WAIT with headroom for the drain itself.
    stop_grace_period: 20s

volumes:
  askbuddy_pgdata:
